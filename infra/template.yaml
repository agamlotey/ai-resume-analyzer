AWSTemplateFormatVersion: "2010-09-09"
Description: Cloud-Based AI Resume Analyzer and Job Matching System (UCS531)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different Availability Zones
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  AdminEmail:
    Type: String
    Default: admin@demo.com
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t2.small, t3.small]
  MinInstances:
    Type: Number
    Default: 1
  MaxInstances:
    Type: Number
    Default: 3
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub resume-analyzer-files-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  MatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-matches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - { AttributeName: user_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  AutoConfirmFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-auto-confirm
      Runtime: python3.12
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 5
      Code:
        ZipFile: |
          def handler(event, context):
              event["response"]["autoConfirmUser"] = True
              if "email" in event["request"]["userAttributes"]:
                  event["response"]["autoVerifyEmail"] = True
              return event

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }
      LambdaConfig:
        PreSignUp: !GetAtt AutoConfirmFunction.Arn

  CognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AutoConfirmFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 8
      TokenValidityUnits:
        IdToken: hours

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Can post jobs and see every user's history
      UserPoolId: !Ref UserPool

  LoadBalancerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP to the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances accept traffic only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref LoadBalancerSG }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AWS::StackName}-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSG]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AWS::StackName}-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "20" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: LabInstanceProfile
        MetadataOptions:
          HttpTokens: required
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref InstanceSG]
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${AWS::StackName}-app" }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -ex
            exec > /var/log/app-setup.log 2>&1
            dnf install -y python3 python3-pip tar
            mkdir -p /opt/app
            cd /opt/app
            aws s3 cp s3://${CodeBucket}/${CodeKey} app.tgz --region ${AWS::Region}
            tar xzf app.tgz
            python3 -m venv venv
            ./venv/bin/pip install -q -r backend/requirements.txt
            cat > /etc/resume-analyzer.env <<'ENVEOF'
            APP_MODE=aws
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            S3_BUCKET=${ResumeBucket}
            JOBS_TABLE=${JobsTable}
            MATCHES_TABLE=${MatchesTable}
            COGNITO_USER_POOL_ID=${UserPool}
            COGNITO_CLIENT_ID=${UserPoolClient}
            ADMIN_EMAIL=${AdminEmail}
            ADMIN_PASSWORD=${AdminPassword}
            ENVEOF
            chmod 600 /etc/resume-analyzer.env
            set -a; . /etc/resume-analyzer.env; set +a
            (cd backend && ../venv/bin/python seed.py) || true
            cat > /etc/systemd/system/resume-analyzer.service <<'SVCEOF'
            [Unit]
            Description=Resume Analyzer API
            After=network-online.target
            [Service]
            EnvironmentFile=/etc/resume-analyzer.env
            WorkingDirectory=/opt/app/backend
            ExecStart=/opt/app/venv/bin/gunicorn --workers 3 --timeout 60 --bind 0.0.0.0:80 --access-logfile - app:app
            Restart=always
            [Install]
            WantedBy=multi-user.target
            SVCEOF
            systemctl daemon-reload
            systemctl enable --now resume-analyzer

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-asg
      VPCZoneIdentifier: !Ref SubnetIds
      MinSize: !Ref MinInstances
      MaxSize: !Ref MaxInstances
      DesiredCapacity: !Ref MinInstances
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

Outputs:
  AppUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  ResumeBucketName:
    Value: !Ref ResumeBucket
  JobsTableName:
    Value: !Ref JobsTable
  MatchesTableName:
    Value: !Ref MatchesTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
